# Inserts this bundle's row into the active DSH profile.
#
# Official prices for DeepSeek, Claude, GPT, Gemini, Grok, and the main
# Chinese vendors are built in (see README.md); add any other model under
# `models`, priced per one million tokens. Override fields from your
# profile's cordis.patch.yml — the row you write there replaces this config.
- insert:
    - id: dsh-token-bill
      name: dsh-token-bill
      config:
        # Default display currency, and the currency of custom `models` prices.
        currency: CNY
        # Currencies the panel's picker offers.
        currencies: [CNY, USD, EUR, RUB, INR, IDR, BRL, HKD]
        # Fetch the day's exchange rates when an amount needs converting.
        exchangeRates: true
        # DeepSeek peak / off-peak pricing (off-peak is half price).
        timeOfDayPricing: true
        # Show each conversation's cost in the sidebar list.
        showInSessionList: true
